<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  max-width:820px;margin:0 auto;padding:10px 12px 0;
}
.tabs{display:flex;gap:4px;margin-bottom:6px;flex:none}
.tab{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 2px;font-size:10.5px;font-weight:800;color:#4A6DA7;cursor:pointer;text-align:center;line-height:1.25}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
.panel{display:none;flex:1;min-height:0;flex-direction:column}
.panel.on{display:flex}
.ctl{display:flex;gap:5px;margin-bottom:4px;flex:none;flex-wrap:wrap}
.ctl button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 6px;font-size:11px;font-weight:800;color:#4A6DA7;cursor:pointer;flex:1;min-width:64px}
.ctl button.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.ctl button.go{background:var(--amber);border-color:var(--amber);color:#fff}
svg{flex:1;min-height:0;width:100%}
.box{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.nm{font-size:16px;font-weight:800;fill:var(--ink)}
.tg{font-size:10.5px;font-weight:800;fill:#4A6DA7;letter-spacing:.4px}
.mt{font-size:11.5px;fill:#4A6DA7}
.mono{font-family:var(--mono)}
.wire{stroke:var(--line);stroke-width:2;fill:none}
.wire.err{stroke:#E8A2A2;stroke-dasharray:5 4}
.hot .box{stroke:var(--amber);stroke-width:2.6;fill:#FFF7E6}
.past .box{stroke:var(--green);fill:#F0FDF4}
.bad .box{stroke:var(--red);stroke-width:2.6;fill:#FEF2F2}
.dim{opacity:.28}
.pk{transition:transform .5s cubic-bezier(.4,.1,.3,1)}
.pk circle{fill:var(--amber);stroke:#fff;stroke-width:2.5}
@media (prefers-reduced-motion:reduce){.pk{transition:none}}

/* 만화/도면 전환 */
.mode{display:flex;gap:5px;margin-bottom:5px;flex:none}
.mode button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px;font-size:12px;font-weight:800;color:#4A6DA7;cursor:pointer}
.mode button.on{border-color:var(--amber);background:var(--amber);color:#fff}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.comicwrap{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch}
.comicwrap img{width:100%;height:auto;border-radius:10px;border:1.5px solid var(--line);background:#fff}

.cap{flex:none;background:#fff;border:1.6px solid var(--ink);border-bottom:none;border-radius:12px 12px 0 0;padding:8px 13px 10px;min-height:78px}
.cap b{font-size:13.5px;display:block}
.cap span{font-size:11.5px;color:#33507E;line-height:1.45;display:block}
.cap code{font-family:var(--mono);font-size:10.5px;background:#EEF3F9;border-radius:5px;padding:1px 6px}
</style>
</head>

<!-- ══ 4. AOP 실행 트레이스 ══ -->
<div class="panel" id="t4">
<div class="mode"><button class="mv on" data-v="comic">🖼 만화로 보기</button><button class="mv" data-v="sim">📐 도면 시뮬레이션</button></div><div class="view comic on"><div class="comicwrap"><img src="img/comic4.webp" alt="4. AOP — 공통 기능을 끼워 넣는 기술" loading="lazy"></div></div><div class="view sim">

  <text class="fileT" x="34" y="34">OrderController.java</text>
  <text class="ln" x="34" y="56">orderService.create(dto);</text>
  <text class="ln" x="34" y="78" id="t4ret" style="fill:#8FA6C6">← 결과 대기 중</text>

  <text class="ln" x="34" y="156">create(dto) {</text>
  <text class="lnk" x="48" y="178">tx.begin();</text>
  <text class="ln" x="48" y="200">try {</text>
  <text class="ln" x="62" y="222">result = 진짜.create(dto);</text>

    <marker id="ad4b" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7z" fill="#15803D"/></marker>

  <!-- 상태판 -->
  <rect class="box" x="360" y="280" width="340" height="120" rx="10"/>
  <text class="fileT" x="374" y="302">실행 상태</text>
  <text class="ln" x="374" y="328" id="t4st1" style="font-size:13px">트랜잭션: <tspan fill="#8FA6C6">없음</tspan></text>
  <text class="ln" x="374" y="352" id="t4st2" style="font-size:13px">DB: 저장 안 됨</text>

function mark(panel,hotId,bad){
  document.querySelectorAll(`#${panel} .stn`).forEach(s=>{
    if(s.id===hotId){s.classList.remove('past','bad');s.classList.add(bad?'bad':'hot');}
    else if(s.classList.contains('hot')){s.classList.replace('hot','past');}
  });
}
function clearMarks(panel){document.querySelectorAll(`#${panel} .stn`).forEach(s=>s.classList.remove('hot','past','bad','dim'));}

/* ── 공통 플레이어: 시나리오 선택 + 재생/한 단계/리셋 ── */
function makePlayer(panelId, opts){
  const P={i:-1, steps:[], timer:null, sc:0};
  const panel=$(panelId);
  function stopAuto(){if(P.timer){clearInterval(P.timer);P.timer=null;
    const pb=panel.querySelector('[data-act="play"]'); if(pb)pb.textContent='▶ 재생';}}
  function doStep(){
    if(P.i>=P.steps.length-1){stopAuto();return;}
    P.i++; P.steps[P.i]();
  }
  function reset(){
    stopAuto(); P.i=-1; opts.onReset(P.sc);
  }
  panel.querySelectorAll('[data-act]').forEach(b=>{
    if(b.dataset.act==='step') b.onclick=()=>{stopAuto();doStep();};
    if(b.dataset.act==='reset') b.onclick=reset;
    if(b.dataset.act==='play') b.onclick=()=>{
      if(P.timer){stopAuto();return;}
      if(P.i>=P.steps.length-1)reset();
      doStep(); P.timer=setInterval(doStep, opts.gap||2100); b.textContent='⏸ 일시정지';
    };
  });
  panel.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{
    panel.querySelectorAll('.sc').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); P.sc=+b.dataset.sc; reset();
  });
  P.load=steps=>{P.steps=steps;};
  P.reset=reset;
  return P;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{

});

function t3base(){clearMarks('t3');
  $('t3wd').textContent='대기';$('t3wd').setAttribute('fill','#4A6DA7');
  $('t3dp').textContent='대기';$('t3dp').setAttribute('fill','#4A6DA7');

function t3steps(sc){
  const s=[
   ()=>{mark('t3','s3-tx');$('t3pk').setAttribute('transform','translate(30,180)');
        cap('1단계 · 프록시가 트랜잭션 시작','호출이 프록시를 거치는 순간, transfer() 실행 전에 트랜잭션이 자동으로 열린다. 개발자 코드에는 이 부분이 없다.');},
   ()=>{mark('t3','s3-wd');$('t3pk').setAttribute('transform','translate(240,180)');
        $('t3wd').textContent='완료 (임시)';$('t3wd').setAttribute('fill','#15803D');

  if(sc===0){s.push(
   ()=>{mark('t3','s3-dp');$('t3pk').setAttribute('transform','translate(450,180)');
        $('t3dp').textContent='완료 (임시)';$('t3dp').setAttribute('fill','#15803D');
        cap('3단계 · deposit() — 입금 완료','여기까지 완료된 것: 출금 + 입금 (둘 다 임시). 메서드 끝까지 도달했다.');},
   ()=>{mark('t3','s3-jd');$('t3pk').setAttribute('transform','translate(450,315)');
        $('t3code').textContent='COMMIT';$('t3ring').setAttribute('stroke','#15803D');$('t3code').setAttribute('fill','#15803D');
        cap('4단계 · 판정: COMMIT','메서드가 예외 없이 정상 종료 → 프록시가 커밋한다. <b>메서드 끝까지 예외 없이 도달해야 커밋된다.</b>');},
   ()=>{mark('t3','s3-db');$('t3pk').setAttribute('transform','translate(60,315)');
        $('t3dbA').textContent='A: 20,000';$('t3dbB').textContent='B: 40,000';$('t3dbN').textContent='둘 다 확정';
        cap('5단계 · DB 확정','임시였던 두 변경이 함께 확정됐다.');});
  }else if(sc===1){s.push(
   ()=>{mark('t3','s3-dp',true);$('t3pk').setAttribute('transform','translate(450,180)');
        $('t3dp').textContent='💥 IllegalStateException';$('t3dp').setAttribute('fill','#C05656');
        cap('3단계 · deposit()에서 💥 RuntimeException','<code>IllegalStateException</code> — 아무도 예상 못 한 사고다. 출금은 이미 실행된 상태.');},
   ()=>{mark('t3','s3-jd',true);$('t3pk').setAttribute('transform','translate(450,315)');

  }
  return s;
}

      $('t4ret').textContent='← 결과 대기 중';['t4sum','t4sumT','t4sum1','t4sum2','t4sum3'].forEach(i=>$(i).setAttribute('opacity',0));
      cap('1줄 · Controller가 서비스를 호출','<code>orderService.create(dto)</code> 실행. 그런데 여기 담긴 orderService는 내가 만든 진짜 객체가 아니라 <b>스프링이 만든 프록시</b>다 (1회차 DI).');},
 ()=>{t4arrow('t4a1',1);t4bar(30,143,280);
      cap('2줄 · 프록시의 create()로 들어간다','내 코드가 아니라 프록시의 create()가 먼저 실행된다. 이 파일은 디스크에 없다 — 스프링이 실행 중에 만들어낸 코드다.');},
 ()=>{t4bar(44,165,270);
      t4state('시작됨','저장 안 됨','tx.begin() 실행','#15803D');

 ()=>{t4arrow('t4a2',1);t4bar(374,167,310);
      cap('4줄 · 이제야 내 코드로 진입','프록시가 진짜 OrderService.create()를 호출한다. 오른쪽 파일 — 여기가 내가 실제로 작성한 코드다.');},
 ()=>{t4bar(384,189,300);
      t4state('시작됨','저장됨 (임시)','repo.save() 실행','#15803D','#B45309');
      cap('5줄 · 핵심 로직 실행','<code>repo.save(dto)</code> — 주문을 저장한다. 내 코드에는 트랜잭션 관련 코드가 <b>한 줄도 없다</b>. 위에 붙은 @Transactional 선언 하나뿐.');},
 ()=>{t4arrow('t4a3',1);t4bar(44,209,270);
      cap('6줄 · 결과를 들고 프록시로 복귀','내 메서드가 끝나고 값이 프록시로 돌아온다. 실행은 아직 안 끝났다 — 프록시에 남은 줄이 있다.');},
 ()=>{t4bar(58,231,260);
      t4state('커밋 완료','저장 확정','tx.commit() 실행','#15803D','#15803D');
      cap('7줄 · tx.commit() — 트랜잭션 커밋','역시 주황색 줄. 내 메서드가 끝난 <b>뒤에</b> 실행된다. 이것이 "뒤에 끼워 넣기". 만약 5줄에서 RuntimeException이 났다면 이 줄 대신 아래 catch의 rollback()이 실행된다.');},
 ()=>{t4arrow('t4a4',1);t4bar(30,67,280);
      $('t4ret').textContent='← Order 반환됨';$('t4ret').setAttribute('style','fill:#15803D');

 ()=>{['t4sum','t4sumT','t4sum1','t4sum2','t4sum3'].forEach(i=>$(i).setAttribute('opacity',1));
      $('t4bar').setAttribute('opacity',0);
      cap('정리 · 이 흐름이 곧 AOP다','호출 → <b>프록시의 앞부분(tx.begin)</b> → 내 코드 → <b>프록시의 뒷부분(tx.commit)</b> → 반환. 내 코드를 건드리지 않고 앞뒤에 공통 기능을 끼워 넣는 것, 이것이 AOP이고 그 심부름꾼이 프록시다. 5번 탭 함정은 이 프록시를 안 거칠 때 생긴다.');}
];

}});
p4.load(T4);
p4.reset();

/* ── 5. 함정 ── */

  $('t5onebody').textContent='save(data);';$('t5call').textContent='';
  $('t5w-in').style.opacity=.2;$('t5w-in-t').style.opacity=.2;
  $('t5pk').setAttribute('transform','translate(30,175)');}
const T5S=[
 [ // 기준
  ()=>{$('t5call').textContent='processOne() 호출';mark('t5','s5-cl');$('t5pk').setAttribute('transform','translate(30,175)');
       cap('기준 시나리오 · 외부에서 호출','다른 Bean이 processOne()을 부른다. 1회차에서 배웠듯 주입받은 것은 진짜 객체가 아니라 프록시다.');},
  ()=>{mark('t5','s5-px');$('t5pk').setAttribute('transform','translate(240,170)');

       cap('프록시의 문 통과 → 트랜잭션 ON','호출이 점선 경계(프록시)를 지났다. 이 순간 트랜잭션이 걸린다.');},
  ()=>{mark('t5','s5-one');$('t5pk').setAttribute('transform','translate(265,155)');

  ()=>{mark('t5','s5-res');$('t5pk').setAttribute('transform','translate(560,380)');
       $('t5stamp').textContent='정상 동작';$('t5stamp').setAttribute('fill','#15803D');
       cap('이것이 기대한 동작','@Transactional이 약속대로 동작했다. 이제 이게 깨지는 두 가지 함정을 보자 → 위 버튼.');}],
 [ // 함정1
  ()=>{$('t5call').textContent='processAll() 호출';mark('t5','s5-cl');$('t5pk').setAttribute('transform','translate(30,175)');

  ()=>{mark('t5','s5-all');$('t5pk').setAttribute('transform','translate(265,340)');
       cap('processAll() 실행','프록시 문은 지났지만, 이 메서드에는 트랜잭션 선언이 없으니 아무것도 안 걸린 상태다.');},
  ()=>{mark('t5','s5-one',true);$('t5pk').setAttribute('transform','translate(420,155)');
       $('t5w-in').style.opacity=1;$('t5w-in-t').style.opacity=1;
       $('t5lamp').textContent='OFF';$('t5lamp').setAttribute('fill','#C05656');$('t5lampd').textContent='문을 안 거침!';
       cap('this.processOne() — 빨간 우회로','같은 클래스 안에서 자기 메서드를 직접 부르면 <b>프록시의 문을 다시 지나지 않는다</b>. @Transactional이 붙어 있어도 무시된다.');},
  ()=>{mark('t5','s5-res',true);$('t5pk').setAttribute('transform','translate(560,380)');
       $('t5stamp').textContent='TX 없음 ⚠';$('t5stamp').setAttribute('fill','#C05656');$('t5stampd').textContent='롤백 안 됨';

/* 만화/도면 전환 */
const GIST={"t1": "Controller는 입출력, Service는 비즈니스 로직, Repository는 DB를 담당한다.", "t2": "트랜잭션은 여러 작업을 전부 성공시키거나 전부 취소한다.", "t3": "프록시가 메서드 앞뒤에서 트랜잭션 시작·Commit·Rollback을 처리한다.", "t4": "AOP는 반복되는 공통 기능을 핵심 로직에서 분리해 프록시로 적용한다.", "t5": "프록시를 거치고 예외가 밖으로 전달되어야 기대한 트랜잭션이 동작한다."}, TITLE={"t1": "1. Service 계층 — 비즈니스 로직의 자리", "t2": "2. 트랜잭션과 ACID", "t3": "3. @Transactional은 어떻게 동작할까", "t4": "4. AOP — 공통 기능을 끼워 넣는 기술", "t5": "5. @Transactional이 안 먹는 대표 함정"};
document.querySelectorAll('.panel').forEach(p=>{
  p.querySelectorAll('.mv').forEach(b=>b.onclick=()=>{
    p.querySelectorAll('.mv').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    p.querySelector('.view.comic').classList.toggle('on',b.dataset.v==='comic');
    p.querySelector('.view.sim').classList.toggle('on',b.dataset.v==='sim');
    if(b.dataset.v==='comic')cap(TITLE[p.id]+' — 한 줄 핵심',GIST[p.id]);
    else cap(TITLE[p.id],'버튼으로 한 단계씩 진행하며 흐름을 따라가 보자.');
  });
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const p=document.getElementById(t.dataset.p);
  if(p.querySelector('.view.comic').classList.contains('on'))cap(TITLE[p.id]+' — 한 줄 핵심',GIST[p.id]);
}));
cap(TITLE['t1']+' — 한 줄 핵심',GIST['t1']);
