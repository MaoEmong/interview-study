<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>데이터 모델링과 SQL 도면 시뮬레이터</title>
<style>
:root{
  --bg:#EEF3F9; --grid:#DCE6F2; --ink:#17325B; --line:#8FA6C6;
  --amber:#F59E0B; --red:#C05656; --green:#15803D; --mono:'SF Mono','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  max-width:820px;margin:0 auto;padding:10px 12px 0;
}
.tabs{display:flex;gap:3px;margin-bottom:6px;flex:none}
.tab{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 1px;font-size:9.5px;font-weight:800;color:#4A6DA7;cursor:pointer;text-align:center;line-height:1.25}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
.panel{display:none;flex:1;min-height:0;flex-direction:column}
.panel.on{display:flex}
.ctl{display:flex;gap:5px;margin-bottom:4px;flex:none;flex-wrap:wrap}
.ctl button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 5px;font-size:10.5px;font-weight:800;color:#4A6DA7;cursor:pointer;flex:1;min-width:58px}
.ctl button.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.ctl button.go{background:var(--amber);border-color:var(--amber);color:#fff}
svg{flex:1;min-height:0;width:100%}
.box{fill:#fff;stroke:#17325B;stroke-width:1.6}
.hd{fill:#1f2937 !important;stroke:#1f2937}
.nm{font-size:16px;font-weight:800;fill:#17325B}
.tg{font-size:10.5px;font-weight:800;fill:#4A6DA7;letter-spacing:.4px}
.mt{font-size:11.5px;fill:#4A6DA7}
.mono{font-family:var(--mono)}
.wire{stroke:#8FA6C6;stroke-width:2;fill:none}
.hot .box{stroke:var(--amber);stroke-width:2.6;fill:#FFF7E6}
.past .box{stroke:var(--green);fill:#F0FDF4}
.bad .box{stroke:var(--red);stroke-width:2.6;fill:#FEF2F2}
.dim{opacity:.25}
.pk{transition:transform .5s cubic-bezier(.4,.1,.3,1)}
.pk circle{fill:var(--amber);stroke:#fff;stroke-width:2.5}
@media (prefers-reduced-motion:reduce){.pk{transition:none}}
.cap{flex:none;background:#fff;border:1.6px solid #17325B;border-bottom:none;border-radius:12px 12px 0 0;padding:8px 13px 10px;min-height:78px}
.cap b{font-size:13.5px;display:block}
.cap span{font-size:11.5px;color:#33507E;line-height:1.45;display:block}
.cap code{font-family:var(--mono);font-size:10.5px;background:#EEF3F9;border-radius:5px;padding:1px 6px}
</style>
</head>
<body>

<div class="tabs">
  <button class="tab on" data-p="t1">1<br>ERD</button>
  <button class="tab" data-p="t2">2<br>정규화</button>
  <button class="tab" data-p="t3">3<br>실행순서</button>
  <button class="tab" data-p="t4">4<br>조인</button>
  <button class="tab" data-p="t5">5<br>NULL</button>
  <button class="tab" data-p="t6">6<br>윈도우</button>
  <button class="tab" data-p="t7">7<br>격리수준</button>
</div>

<!-- ══ 1. ERD ══ -->
<div class="panel on" id="t1">
<div class="ctl">
  <button class="sc sel" data-sc="0">① 고객—주문</button>
  <button class="sc" data-sc="1">② 주문—상세</button>
  <button class="sc" data-sc="2">③ 부서—사원</button>
  <button class="go" data-act="play">▶ 재생</button>
  <button data-act="step">한 단계 ▸</button>
  <button data-act="reset">⟲ 리셋</button>
</div>
<svg viewBox="0 0 720 440" preserveAspectRatio="xMidYMid meet">
  <text x="360" y="36" text-anchor="middle" class="nm" style="font-size:15px">관계선은 양쪽 끝을 두 번 읽는다 — 반대편 끝이 답이다</text>

  <g id="t1gL">
    <line x1="248" y1="171" x2="248" y2="199" class="wire" stroke-width="2.4"/>
    <line x1="262" y1="171" x2="262" y2="199" class="wire" stroke-width="2.4"/>
  </g>
  <g id="t1gR">
    <circle id="t1Rcirc" cx="438" cy="185" r="8" fill="#fff" stroke="#8FA6C6" stroke-width="2.4"/>
    <line id="t1Rbar" x1="440" y1="171" x2="440" y2="199" class="wire" stroke-width="2.4" style="display:none"/>
    <path d="M458,185 L490,171 M458,185 L490,199 M458,185 L490,185" class="wire" stroke-width="2.4"/>
  </g>
  <text class="mt" x="140" y="248" text-anchor="middle" id="t1lblL" style="font-size:12px;font-weight:800"></text>
  <text class="mt" x="580" y="248" text-anchor="middle" id="t1lblR" style="font-size:12px;font-weight:800"></text>
  <g><rect class="box" x="60" y="290" width="600" height="118" rx="10" style="stroke-dasharray:6 4"/>
    <text class="tg" x="76" y="314">이 관계를 읽으면</text>
    <text class="nm" x="76" y="344" id="t1read1" style="font-size:13.5px"></text>
    <text class="nm" x="76" y="376" id="t1read2" style="font-size:13.5px"></text></g>
  <g class="pk" id="t1pk" transform="translate(360,110)"><circle r="12"/></g>
</svg>
</div>

<!-- ══ 2. 정규화 (단계별) ══ -->
<div class="panel" id="t2">
<div class="ctl">
  <button class="sc sel" data-sc="0">① 이상현상 체험</button>
  <button class="sc" data-sc="1">② 단계별 정규화</button>
  <button class="go" data-act="play">▶ 재생</button>
  <button data-act="step">한 단계 ▸</button>
  <button data-act="reset">⟲ 리셋</button>
</div>
<svg viewBox="0 0 720 560" preserveAspectRatio="xMidYMid meet">

    <g class="stn" id="t2z1"><rect class="box" x="60" y="86" width="600" height="38"/>
      <text class="mt" x="110" y="110" text-anchor="middle" style="font-size:12.5px">1</text>
      <text class="mt" x="215" y="110" text-anchor="middle" style="font-size:12.5px">이승욱</text>
      <text class="mt" x="375" y="110" text-anchor="middle" style="font-size:12.5px;font-weight:800" fill="#C05656">SQL기초, 자바입문</text>
      <text class="mt" x="565" y="110" text-anchor="middle" style="font-size:12.5px;font-weight:800" fill="#C05656">최주호, 김태혁</text></g>
    <g class="stn" id="t2z2"><rect class="box" x="60" y="124" width="600" height="38"/>
      <text class="mt" x="110" y="148" text-anchor="middle" style="font-size:12.5px">2</text>
      <text class="mt" x="215" y="148" text-anchor="middle" style="font-size:12.5px">김현지</text>
      <text class="mt" x="375" y="148" text-anchor="middle" style="font-size:12.5px">SQL기초</text>
      <text class="mt" x="565" y="148" text-anchor="middle" style="font-size:12.5px">최주호</text></g>
  </g>
  <!-- 1NF 테이블 -->
  <g id="t2nf1" style="display:none">
    <rect class="hd" x="60" y="50" width="600" height="36" rx="4"/>
    <text x="110" y="73" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">학번</text>
    <text x="215" y="73" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">학생명</text>
    <text x="375" y="73" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">강좌코드·강좌명</text>
    <text x="565" y="73" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle">강사명</text>
    <g class="stn" id="t2row1"><rect class="box" x="60" y="86" width="600" height="38"/>

      <text class="mt" x="375" y="110" text-anchor="middle" style="font-size:12.5px">C1 · SQL기초</text>
      <text class="mt" x="565" y="110" text-anchor="middle" style="font-size:12.5px;font-weight:800" id="t2c1t">최주호</text></g>
    <g class="stn" id="t2row2"><rect class="box" x="60" y="124" width="600" height="38"/>

      <text class="mt" x="215" y="148" text-anchor="middle" style="font-size:12.5px" id="t2c2s">이승욱</text>
      <text class="mt" x="375" y="148" text-anchor="middle" style="font-size:12.5px">C2 · 자바입문</text>
      <text class="mt" x="565" y="148" text-anchor="middle" style="font-size:12.5px" id="t2c2t">김태혁</text></g>
    <g class="stn" id="t2row3"><rect class="box" x="60" y="162" width="600" height="38"/>
      <text class="mt" x="110" y="186" text-anchor="middle" style="font-size:12.5px">2</text>
      <text class="mt" x="215" y="186" text-anchor="middle" style="font-size:12.5px" id="t2c3s">김현지</text>
      <text class="mt" x="375" y="186" text-anchor="middle" style="font-size:12.5px">C1 · SQL기초</text>
      <text class="mt" x="565" y="186" text-anchor="middle" style="font-size:12.5px;font-weight:800" id="t2c3t">최주호</text></g>
  </g>
  <text class="mt" x="360" y="228" text-anchor="middle" id="t2msg" style="font-size:13px;font-weight:800" fill="#C05656"></text>
  <!-- 2NF: 학생 분리 -->
  <g class="stn" id="t2stu" style="display:none"><rect class="box" x="60" y="260" width="170" height="110" rx="8"/>

</svg>
</div>

<!-- ══ 3. 실행 순서 ══ -->
<div class="panel" id="t3">
<div class="ctl">
  <button class="go" data-act="play">▶ 재생</button>
  <button data-act="step">한 단계 ▸</button>
  <button data-act="reset">⟲ 리셋</button>
</div>
<svg viewBox="0 0 720 480" preserveAspectRatio="xMidYMid meet">
  <rect class="box" x="30" y="30" width="360" height="270" rx="10"/>
  <text class="tg" x="46" y="54">내가 쓴 SQL (쓴 순서)</text>
  <rect id="t3bar" x="42" y="0" width="336" height="27" fill="#FFF7E6" stroke="#F59E0B" stroke-width="2" rx="5" opacity="0"/>
  <text class="mono" x="52" y="90"  style="font-size:14px" fill="#33507E">SELECT 부서, COUNT(*) AS 인원</text>
  <text class="mono" x="52" y="125" style="font-size:14px" fill="#33507E">FROM 사원</text>
  <text class="mono" x="52" y="160" style="font-size:14px" fill="#33507E">WHERE 연봉 >= 3000</text>
  <text class="mono" x="52" y="195" style="font-size:14px" fill="#33507E">GROUP BY 부서</text>
  <text class="mono" x="52" y="230" style="font-size:14px" fill="#33507E">HAVING COUNT(*) >= 2</text>
  <text class="mono" x="52" y="265" style="font-size:14px" fill="#33507E">ORDER BY 인원 DESC</text>
  <g class="stn" id="t3state"><rect class="box" x="430" y="30" width="260" height="270" rx="10"/>

    <text class="mt" x="446" y="152" id="t3s3"></text>
    <text class="mt" x="446" y="178" id="t3s4"></text></g>
  <g><rect class="box" x="30" y="330" width="660" height="110" rx="10" style="stroke-dasharray:6 4"/>
    <text class="tg" x="46" y="354">실행 순서</text>
    <text class="nm mono" x="46" y="384" style="font-size:14px">FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</text>
    <text class="mt" x="46" y="412">쓴 순서(SELECT부터)와 실행 순서(FROM부터)가 다르다 — 여기서 유명한 함정들이 풀린다</text></g>

</div>

<!-- ══ 4. 조인 ══ -->

<!-- ══ 5. NULL ══ -->
<div class="panel" id="t5">
<div class="ctl">
  <button class="sc sel" data-sc="0">① 비교 함정</button>
  <button class="sc" data-sc="1">② 연산 함정</button>

  <button data-act="step">한 단계 ▸</button>

</div>
<svg viewBox="0 0 720 520" preserveAspectRatio="xMidYMid meet">
  <g><rect class="box" x="60" y="24" width="600" height="52" rx="10"/>
    <text class="mono" x="360" y="56" text-anchor="middle" id="t5q" style="font-size:15px;font-weight:700" fill="#17325B"></text></g>

  <text x="590" y="123" fill="#fff" font-size="12.5" font-weight="700" text-anchor="middle" id="t5col">평가</text>
  <g class="stn" id="t5r1"><rect class="box" x="60" y="136" width="600" height="44"/>
    <text class="mt" x="150" y="163" text-anchor="middle" style="font-size:13px">김현지</text>
    <text class="mt" x="320" y="163" text-anchor="middle" style="font-size:13px" class="mono">3,000</text>

<script>
const $=id=>document.getElementById(id);
const cap=(t,x)=>{$('capT').textContent=t;$('capX').innerHTML=x;};
function mark(panel,hotId,bad){
  document.querySelectorAll(`#${panel} .stn`).forEach(s=>{
    if(s.id===hotId){s.classList.remove('past','bad');s.classList.add(bad?'bad':'hot');}
    else if(s.classList.contains('hot')){s.classList.replace('hot','past');}
  });
}
function clearMarks(panel){document.querySelectorAll(`#${panel} .stn`).forEach(s=>s.classList.remove('hot','past','bad','dim'));}
function makePlayer(panelId, opts){
  const P={i:-1, steps:[], timer:null, sc:0};
  const panel=$(panelId);
  function stopAuto(){if(P.timer){clearInterval(P.timer);P.timer=null;
    const pb=panel.querySelector('[data-act="play"]'); if(pb)pb.textContent='▶ 재생';}}
  function doStep(){ if(P.i>=P.steps.length-1){stopAuto();return;} P.i++; P.steps[P.i](); }
  function reset(){ stopAuto(); P.i=-1; opts.onReset(P.sc); }
  panel.querySelectorAll('[data-act]').forEach(b=>{
    if(b.dataset.act==='step') b.onclick=()=>{stopAuto();doStep();};
    if(b.dataset.act==='reset') b.onclick=reset;
    if(b.dataset.act==='play') b.onclick=()=>{
      if(P.timer){stopAuto();return;}
      if(P.i>=P.steps.length-1)reset();
      doStep(); P.timer=setInterval(doStep, opts.gap||2200); b.textContent='⏸ 일시정지';
    };
  });
  panel.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{
    panel.querySelectorAll('.sc').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); P.sc=+b.dataset.sc; reset();
  });
  P.load=s=>{P.steps=s;}; P.reset=reset; return P;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');$(t.dataset.p).classList.add('on');
});

/* ── 1. ERD ── */
const T1S=[
 {L:'고객',R:'주문',dash:true,opt:true,
  rd1:'· 고객 한 명은 주문을 0개 이상 가진다 (가입만 하고 주문 안 할 수도)',
  rd2:'· 주문 하나는 반드시 고객 한 명에게 속한다 (주인 없는 주문 없음)',
  dashCap:'점선 = 비식별 관계. 고객번호는 주문의 PK가 아니라 일반 FK로 들어간다.'},
 {L:'주문',R:'주문상세',dash:false,opt:false,
  rd1:'· 주문 하나는 주문상세를 반드시 1개 이상 가진다 (빈 주문 없음)',
  rd2:'· 주문상세 하나는 반드시 주문 하나에 속한다',
  dashCap:'실선 = 식별 관계. 주문번호가 주문상세 PK의 일부가 된다 — 주문 없이 상세는 존재 불가.'},
 {L:'부서',R:'사원',dash:true,opt:true,
  rd1:'· 부서 하나에 사원이 0명 이상 (신설 부서는 사원이 없을 수도)',
  rd2:'· 사원 한 명은 반드시 부서 하나에 소속된다',
  dashCap:'점선 = 비식별. 부서코드는 사원의 일반 FK — 사원은 사번으로 식별된다.'}
];
function t1apply(sc){
  const d=T1S[sc];
  $('t1eL').textContent=d.L; $('t1eR').textContent=d.R;
  $('t1line').setAttribute('stroke-dasharray', d.dash?'8 6':'none');
  $('t1Rcirc').style.display=d.opt?'':'none';
  $('t1Rbar').style.display=d.opt?'none':'';
  $('t1lblL').textContent=''; $('t1lblR').textContent='';
  $('t1read1').textContent=''; $('t1read2').textContent='';
}
const p1=makePlayer('t1',{gap:2400,onReset:sc=>{
  clearMarks('t1'); t1apply(sc);
  $('t1pk').setAttribute('transform','translate(360,110)');
  cap(`ERD 읽기 — ${T1S[sc].L} · ${T1S[sc].R}`,'노란 점이 지금 읽는 위치다. 한 단계씩 따라가자.');
  p1.load([
   ()=>{const d=T1S[sc];$('t1pk').setAttribute('transform','translate(452,148)');mark('t1','t1ER');
        $('t1lblR').textContent=d.opt?'o< = 0개 이상 (선택·여러 개)':'|< = 반드시 1개 이상 (필수·여러 개)';
        cap(`① ${d.R} 쪽 끝을 읽는다`,`${d.L} 입장에서 ${d.R}이(가) 몇 개인가 — <b>반대편 끝의 기호가 답</b>이다.`);},
   ()=>{const d=T1S[sc];$('t1pk').setAttribute('transform','translate(255,148)');mark('t1','t1EL');
        $('t1lblL').textContent='|| = 반드시 1개 (필수·하나)';
        cap(`② ${d.L} 쪽 끝을 읽는다`,`${d.R} 입장에서 ${d.L}은(는) — 세로선 두 개, 반드시 1개다.`);},
   ()=>{const d=T1S[sc];$('t1pk').setAttribute('transform','translate(360,185)');clearMarks('t1');
        cap('③ 선의 종류를 본다',d.dashCap);},
   ()=>{const d=T1S[sc];$('t1pk').setAttribute('transform','translate(360,290)');
        $('t1read1').textContent=d.rd1;$('t1read2').textContent=d.rd2;
        cap('④ 종합 — 양방향으로 두 문장','이 두 문장이 나오면 다 읽은 것이다. 시험은 이 문장의 참/거짓을 묻는다.');}
  ]);
}});
p1.reset();

/* ── 2. 정규화 (단계별) ── */
function t2show(nf0,nf1,stu,enr,crs,tea){
  $('t2nf0').style.display=nf0?'':'none';
  $('t2nf1').style.display=nf1?'':'none';
  $('t2stu').style.display=stu?'':'none';
  $('t2enr').style.display=enr?'':'none';
  $('t2crs').style.display=crs?'':'none';
  $('t2tea').style.display=tea?'':'none';
}
function t2base(){
  clearMarks('t2'); t2show(0,1,0,0,0,0);
  $('t2stage').textContent='수강 테이블';
  $('t2c1t').textContent='최주호'; $('t2c1t').setAttribute('fill','#4A6DA7');

  $('t2nf1').style.opacity=1;
}
const p2=makePlayer('t2',{gap:2600,onReset:sc=>{
  t2base();
  if(sc===0){
    cap('① 이상현상 체험 — 왜 쪼개야 하나','한 테이블에 다 담으면 어떤 사고가 나는지 직접 본다.');
    p2.load([
     ()=>{mark('t2','t2row1');cap('상황: 최주호 강사가 개명했다','강사명이 여러 행에 흩어져 있다. 전부 고쳐야 한다.');},
     ()=>{$('t2c1t').textContent='최준호';$('t2c1t').setAttribute('fill','#C05656');mark('t2','t2row1',true);
          cap('1행만 수정하고 깜빡했다','1행은 최준호로 바뀌었는데—');},
     ()=>{mark('t2','t2row3',true);$('t2c3t').setAttribute('fill','#C05656');
          $('t2msg').textContent='⚠ 1행과 3행이 서로 모순 — 갱신 이상';
          cap('갱신 이상','같은 강사가 두 이름으로 존재한다. 어느 쪽이 진실인지 DB는 모른다.');},
     ()=>{cap('삽입·삭제 이상도 같은 뿌리','수강생 없는 새 강좌는 넣을 수 없고(삽입), 2행을 지우면 자바입문 정보가 통째로 사라진다(삭제). 원인은 하나 — 서로 다른 관심사가 한 테이블에 섞여 있다. ②에서 이 표를 그대로 단계별로 쪼갠다.');}
    ]);
  }else{
    cap('② 단계별 정규화','①에서 본 그 표의 과거로 돌아간다 — 비정규에서 출발해 1NF → 2NF → 3NF 순서로 쪼갠다.');
    t2show(1,0,0,0,0,0);
    $('t2stage').textContent='비정규 — 한 칸에 값이 여러 개';
    p2.load([
     ()=>{t2show(1,0,0,0,0,0);mark('t2','t2z1',true);
          $('t2stage').textContent='비정규 — 한 칸에 값이 여러 개';
          cap('출발: 비정규 상태','①과 같은 표인데 아직 행도 안 나눈 상태다. 이승욱의 강좌 칸과 강사 칸에 값이 두 개씩 — 이대로는 "자바입문 수강생"을 조건으로 걸 수도, 하나만 지울 수도 없다.');},
     ()=>{t2show(0,1,0,0,0,0);clearMarks('t2');
          $('t2stage').textContent='1NF — 모든 칸은 원자값';
          cap('1정규형: 한 칸에 값 하나','행을 분리하니 ①에서 봤던 바로 그 3행 표가 됐다 — 이상현상이 있던 상태가 곧 1NF다. 키는 (학번+강좌코드) 조합.');},
     ()=>{['t2c1s','t2c2s'].forEach(i=>$(i).setAttribute('fill','#C05656'));mark('t2','t2row1',true);mark('t2','t2row2',true);
          $('t2msg').textContent='학생명은 키 전체가 아니라 학번에만 종속 — 부분 함수 종속';
          cap('2NF 위반 발견','키가 (학번+강좌코드)인데 학생명은 학번만 알면 정해진다. 키의 일부에만 종속 = 부분 함수 종속. 그래서 이승욱이 두 번 반복된다.');},
     ()=>{t2show(0,1,1,0,0,0);clearMarks('t2');mark('t2','t2stu');
          ['t2c1s','t2c2s'].forEach(i=>$(i).setAttribute('fill','#8FA6C6'));
          $('t2msg').textContent='';$('t2stage').textContent='2NF — 부분 종속 제거';
          cap('2정규형: 학생을 분리','학번에만 종속된 학생명을 학생 테이블로 뺐다. 위 테이블의 학생명 컬럼은 이제 필요 없다.');},

          $('t6note').textContent='셋의 차이는 공동 순위 처리뿐: 건너뜀(RANK) / 안 건너뜀(DENSE) / 동점 무시(ROW_NUMBER)';
          $('t6note2').textContent='Top-N 쿼리에서 "동점 포함 3명"이면 RANK <= 3, "딱 3행"이면 ROW_NUMBER <= 3';
          cap('세 값이 갈리는 지점은 이승욱 행','4000의 순위가 3 / 2 / 3으로 다르다. 시험은 정확히 이 지점을 묻는다.');}
    ]);
  }
}});
p6.reset();

/* ── 7. 격리 수준 ── */
function t7base(){
  clearMarks('t7');
  $('t7dbl').textContent='계좌 잔액 (DB)';$('t7dbv').textContent='50,000';$('t7dbv').setAttribute('fill','#17325B');
  ['t7a1','t7a2','t7a3','t7b1','t7b2','t7b3'].forEach(i=>$(i).textContent='');
  $('t7aread').textContent='';
  $('t7block').textContent='READ UNCOMMITTED → COMMITTED → REPEATABLE READ → SERIALIZABLE 순으로 하나씩 차단된다';
}
const p7=makePlayer('t7',{gap:2400,onReset:sc=>{
  t7base();
  cap(['① Dirty Read — 커밋 안 된 값을 읽음','② Non-Repeatable Read — 두 번 읽으니 값이 다름','③ Phantom Read — 없던 행이 나타남'][sc],'A와 B가 동시에 실행된다. 한 단계씩.');
  if(sc===0){
    p7.load([
     ()=>{mark('t7','t7B');$('t7b1').textContent='① UPDATE 잔액 → 20,000 (아직 커밋 안 함)';
          $('t7dbv').textContent='20,000 (임시)';$('t7dbv').setAttribute('fill','#B45309');
          cap('B가 값을 바꿨다 — 커밋 전','이 변경은 아직 확정이 아니다. B는 언제든 롤백할 수 있다.');},
     ()=>{mark('t7','t7A',true);$('t7a1').textContent='② SELECT 잔액 → 20,000 읽음';
          $('t7aread').textContent='내가 읽은 값: 20,000 ⚠';$('t7aread').setAttribute('fill','#C05656');
          cap('A가 그 임시 값을 읽었다','격리가 가장 낮으면(READ UNCOMMITTED) 커밋 안 된 값도 보인다 — Dirty Read.');},
     ()=>{mark('t7','t7B',true);$('t7b2').textContent='③ ROLLBACK — 변경 취소';
          $('t7dbv').textContent='50,000';$('t7dbv').setAttribute('fill','#17325B');
          cap('B가 롤백했다','DB는 50,000으로 돌아갔다. 그런데 A는—');},
     ()=>{$('t7a2').textContent='④ 20,000 기준으로 판단·처리 진행 중…';
          $('t7block').innerHTML='<tspan font-weight="800" fill="#15803D">READ COMMITTED부터 차단</tspan> — 커밋된 값만 읽으면 사라지는 문제';
          cap('A는 세상에 없는 값을 읽었다','존재한 적 없는 20,000으로 일을 진행했다. 그래서 대부분의 DB는 READ UNCOMMITTED를 쓰지 않는다.');}
    ]);
  }else if(sc===1){
    p7.load([
     ()=>{mark('t7','t7A');$('t7a1').textContent='① SELECT 잔액 → 50,000';
          $('t7aread').textContent='첫 번째 읽기: 50,000';$('t7aread').setAttribute('fill','#17325B');
          cap('A가 잔액을 읽었다','트랜잭션은 아직 진행 중이다.');},
     ()=>{mark('t7','t7B');$('t7b1').textContent='② UPDATE 잔액 → 30,000';$('t7b2').textContent='③ COMMIT — 확정';
          $('t7dbv').textContent='30,000';
          cap('B가 바꾸고 커밋까지 했다','이번엔 Dirty가 아니다 — 정식으로 확정된 변경이다.');},
     ()=>{mark('t7','t7A',true);$('t7a2').textContent='④ 같은 행 다시 SELECT → 30,000';
          $('t7aread').textContent='같은 트랜잭션인데 50,000 → 30,000 ⚠';$('t7aread').setAttribute('fill','#C05656');
          cap('같은 행인데 값이 다르다','한 트랜잭션 안에서 같은 조회의 결과가 변했다 — Non-Repeatable Read. READ COMMITTED에서도 발생.');},
     ()=>{$('t7block').innerHTML='<tspan font-weight="800" fill="#15803D">REPEATABLE READ부터 차단</tspan> — 트랜잭션 시작 시점의 스냅샷을 계속 읽는다';
          cap('차단하려면 한 단계 위로','반복 읽기 일관성이 필요하면 REPEATABLE READ. 대신 동시성이 줄어든다 — 안전과 성능의 거래.');}
    ]);
  }else{
    p7.load([
     ()=>{$('t7dbl').textContent='잔액 1만 이상 계좌 수';$('t7dbv').textContent='2건';
          mark('t7','t7A');$('t7a1').textContent='① COUNT(조건) → 2건';
          $('t7aread').textContent='첫 번째 조회: 2건';$('t7aread').setAttribute('fill','#17325B');
          cap('A가 조건으로 집계했다','이번엔 한 행이 아니라 조건에 맞는 집합을 읽는다.');},
     ()=>{mark('t7','t7B');$('t7b1').textContent='② INSERT 새 계좌 (잔액 2만)';$('t7b2').textContent='③ COMMIT';
          $('t7dbv').textContent='3건';
          cap('B가 조건에 맞는 행을 새로 넣었다','수정이 아니라 삽입 — 기존 행은 아무도 안 건드렸다.');},
     ()=>{mark('t7','t7A',true);$('t7a2').textContent='④ 같은 조건 다시 COUNT → 3건';
          $('t7aread').textContent='2건 → 3건, 유령 행 등장 ⚠';$('t7aread').setAttribute('fill','#C05656');
          cap('없던 행이 나타났다 — Phantom','행 수정은 REPEATABLE READ가 막지만, 새 행(유령)은 조건 조회에 끼어들 수 있다.');},
     ()=>{$('t7block').innerHTML='<tspan font-weight="800" fill="#15803D">SERIALIZABLE에서 차단</tspan> — 사실상 순차 실행. 가장 안전하지만 가장 느리다';
          cap('세 문제 = 계단','Dirty → Non-Repeatable → Phantom. 수준이 오를 때마다 하나씩 차단된다. "전부 차단"이 항상 답이면 단계가 있을 이유가 없다.');}
    ]);
  }
}});
p7.reset();
cap('데이터 모델링과 SQL 도면 시뮬레이터','탭 7개: 모델링(ERD·정규화)부터 SQL 기본·활용(실행순서·조인·NULL·윈도우)과 격리 수준까지. ▶ 재생 또는 "한 단계 ▸"로.');
</script>
