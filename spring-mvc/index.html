<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring MVC 만화 · 도면 시뮬레이터</title>
<style>
:root{
  --bg:#EEF3F9; --grid:#DCE6F2; --ink:#17325B; --line:#8FA6C6;
  --amber:#F59E0B; --amber-deep:#B45309; --red:#C05656; --green:#15803D;
  --blue:#2B5CE6; --mono:'SF Mono','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  max-width:820px;margin:0 auto;padding:10px 12px 0;
}
.tabs{display:flex;gap:4px;margin-bottom:6px;flex:none}
.tab{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 2px;font-size:10.5px;font-weight:800;color:#4A6DA7;cursor:pointer;text-align:center;line-height:1.25}
.tab.on{border-color:var(--ink);background:var(--ink);color:#fff}
.panel{display:none;flex:1;min-height:0;flex-direction:column}
.panel.on{display:flex}
.ctl{display:flex;gap:5px;margin-bottom:4px;flex:none;flex-wrap:wrap}
.ctl button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;font-size:11.5px;font-weight:800;color:#4A6DA7;cursor:pointer;flex:1;min-width:70px}
.ctl button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.ctl button.go{background:var(--amber);border-color:var(--amber);color:#fff}
svg{flex:1;min-height:0;width:100%}
/* SVG 공통 */
.box{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.nm{font-size:17px;font-weight:800;fill:var(--ink)}
.tg{font-size:10.5px;font-weight:800;fill:#4A6DA7;letter-spacing:.4px}
.mt{font-size:11.5px;fill:#4A6DA7}
.mono{font-family:var(--mono)}
.wire{stroke:var(--line);stroke-width:2;fill:none}
.wire.err{stroke:#E8A2A2;stroke-dasharray:5 4}
.hot .box{stroke:var(--amber);stroke-width:2.6;fill:#FFF7E6}
.past .box{stroke:var(--green);fill:#F0FDF4}
.dim{opacity:.28}
.pk{transition:transform .5s cubic-bezier(.4,.1,.3,1)}
.pk circle{fill:var(--amber);stroke:#fff;stroke-width:2.5}
@media (prefers-reduced-motion:reduce){.pk{transition:none}}

/* 만화/도면 전환 */
.mode{display:flex;gap:5px;margin-bottom:5px;flex:none}
.mode button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px;font-size:12px;font-weight:800;color:#4A6DA7;cursor:pointer}
.mode button.on{border-color:var(--amber);background:var(--amber);color:#fff}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.comicwrap{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch}
.comicwrap img{width:100%;height:auto;border-radius:10px;border:1.5px solid var(--line);background:#fff}

/* 해설 */
.cap{flex:none;background:#fff;border:1.6px solid var(--ink);border-bottom:none;border-radius:12px 12px 0 0;padding:8px 13px 10px;min-height:74px}
.cap b{font-size:13.5px;display:block}
.cap span{font-size:11.5px;color:#33507E;line-height:1.45;display:block}
.cap code{font-family:var(--mono);font-size:10.5px;background:#EEF3F9;border-radius:5px;padding:1px 6px}
</style>
</head>
<body>

<div class="tabs">
  <button class="tab on" data-p="t1">1<br>요청의 여정</button>

    <text class="mt" x="416" y="248">어떤 예외든 받아 에러 응답으로 변환</text></g>
  <g class="stn" id="t5-ok"><rect class="box" x="30" y="420" width="310" height="80" rx="10" style="stroke:#15803D"/>
    <text class="tg" x="46" y="442" fill="#15803D">성공 응답</text>
    <text class="nm mono" x="46" y="468" style="font-size:15px" id="t5okc">201 Created</text>
    <text class="mono" x="46" y="490" style="font-size:11px" fill="#4A6DA7" id="t5okb">{"id":13,"title":"후기"}</text></g>
  <g class="stn" id="t5-er"><rect class="box" x="400" y="420" width="290" height="80" rx="10" style="stroke:#C05656"/>
    <text class="tg" x="416" y="442" fill="#C05656">에러 응답 — 형식은 항상 동일</text>
    <text class="nm mono" x="416" y="468" style="font-size:15px" id="t5erc">400 Bad Request</text>
    <text class="mono" x="416" y="490" style="font-size:10.5px" fill="#4A6DA7" id="t5erb"></text></g>
  <g class="pk" id="t5pk" transform="translate(30,42)"><circle r="12"/></g>
</svg>
</div>
</div>

<div class="cap" id="cap">
  <b id="capT">도면 시뮬레이터</b>
  <span id="capX">탭에서 개념을 고르고, 버튼으로 패킷을 움직여 보자. 각 도면은 한 화면에 다 보인다.</span>
</div>

<script>
const $=id=>document.getElementById(id);
const cap=(t,x)=>{$('capT').textContent=t;$('capX').innerHTML=x;};
let timers=[];
const clearT=()=>{timers.forEach(clearTimeout);timers=[];};
const seq=(fns,gap=1900)=>{clearT();fns.forEach((f,i)=>timers.push(setTimeout(f,i*gap)));};

/* 탭 */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  clearT();
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');$(t.dataset.p).classList.add('on');
});

/* 공통: 역 상태 */
function mark(panel,hotId){
  document.querySelectorAll(`#${panel} .stn`).forEach(s=>{
    if(s.id===hotId){s.classList.remove('past');s.classList.add('hot');}
    else if(s.classList.contains('hot')){s.classList.replace('hot','past');}
  });
}
function clearMarks(panel){document.querySelectorAll(`#${panel} .stn`).forEach(s=>s.classList.remove('hot','past','dim'));}

/* ── 1 ── */
const T1=[
 {id:'s1-cl',p:[250,35],t:'① 브라우저가 요청을 보낸다',x:'<code>GET /api/posts/1</code> — "1번 글 주세요". 요청이 서버로 출발한다.'},
 {id:'s1-ds',p:[30,126],t:'② 접수처가 가장 먼저 받는다',x:'요청은 Controller로 바로 가지 않는다. 모든 요청은 DispatcherServlet이 먼저 받아 처리를 지휘한다.'},
 {id:'s1-hm',p:[30,226],t:'③ 담당자를 찾는다',x:'주소와 방식(GET)을 보고 담당을 찾는다 → <code>PostController.findOne(Long id)</code>'},
 {id:'s1-ha',p:[30,326],t:'④ 재료를 꺼내 준비한다',x:'URL 속 1을 꺼내 <code>@PathVariable id = 1</code> 로 넣어준다. 호출 준비 완료.'},
 {id:'s1-ct',p:[205,446],t:'⑤ 내가 쓴 코드가 실행된다',x:'개발자가 만든 건 이 역 하나. <code>return new PostResponse(1, "스프링 스터디")</code>'},
 {id:'s1-mc',p:[400,326],t:'⑥ JSON으로 포장한다',x:'자바 객체를 클라이언트가 읽을 수 있는 <code>{"id":1,"title":"스프링 스터디"}</code> 로 변환.'},
 {id:'s1-rs',p:[400,226],t:'⑦ 상태 코드 도장: 200 OK',x:'조회 성공이니 200. 상태 코드 + JSON이 합쳐져 하나의 응답이 된다.'},
 {id:'s1-cl',p:[250,35],t:'⑧ 응답이 돌아왔다 — 여정 끝',x:'요청은 시계 반대 방향으로 내려갔다가, 응답이 되어 올라온다. 나머지는 전부 스프링이 해줬다.'}
];
let t1i=-1;
function t1do(){
  if(t1i>=T1.length-1)return;
  t1i++;const s=T1[t1i];
  mark('t1',s.id);
  $('t1pk').setAttribute('transform',`translate(${s.p[0]},${s.p[1]})`);
  cap(s.t,s.x);
}
function t1reset(){clearT();t1i=-1;clearMarks('t1');$('t1pk').setAttribute('transform','translate(250,35)');cap('1. 요청의 여정','▶ 재생을 누르면 패킷이 도면을 한 바퀴 돈다. 왼쪽으로 내려가는 길이 요청, 오른쪽으로 올라오는 길이 응답이다.');}
$('t1step').onclick=()=>{clearT();t1do();};
$('t1play').onclick=()=>{t1reset();seq(T1.map(()=>t1do),2100);};
$('t1reset').onclick=t1reset;
t1reset();

/* ── 2 ── */
function t2run(rest){
  clearT();clearMarks('t2');
  $('t2a').classList.toggle('on',!rest);$('t2b').classList.toggle('on',rest);
  $('t2ret').textContent=rest?'return orderResponse;':'return "home";';
  $('t2q').textContent=rest?'이 객체는 어디로 갈까?':'이 문자열은 어디로 갈까?';
  ['s2-vr','s2-html'].forEach(id=>$(id).classList.toggle('dim',rest));
  ['s2-mc','s2-json'].forEach(id=>$(id).classList.toggle('dim',!rest));
  const path=rest?[['s2-ct',[200,52]],['s2-mc',[380,190]],['s2-json',[380,392]]]
                 :[['s2-ct',[200,52]],['s2-vr',[20,190]],['s2-html',[20,392]]];
  const caps=rest?[
    ['@RestController 가 반환했다','반환값은 뷰 이름이 아니라 <b>응답 본문 그 자체</b>다.'],
    ['MessageConverter 경유','객체를 JSON으로 직렬화한다. @RestController = @Controller + @ResponseBody.'],
    ['결과: JSON 데이터','화면이 아니라 데이터가 나간다. 앱·SPA 프론트가 이걸 받아 자기 화면을 그린다.']
  ]:[
    ['@Controller 가 반환했다','문자열 "home"은 <b>뷰 이름</b>으로 해석된다.'],
    ['ViewResolver 경유','"home" → templates/home.html 을 찾아 HTML을 렌더링한다.'],
    ['결과: 완성된 HTML 화면','서버가 화면 자체를 만들어 보낸다. 브라우저는 받은 그대로 그린다.']
  ];
  seq(path.map((p,i)=>()=>{
    mark('t2',p[0]);
    $('t2pk').setAttribute('transform',`translate(${p[1][0]},${p[1][1]})`);
    cap(caps[i][0],caps[i][1]);
  }),1700);
}
$('t2a').onclick=()=>t2run(false);
$('t2b').onclick=()=>t2run(true);

/* ── 3 ── */
const T3=[
 {url:'GET /api/posts/3',body:'',v1:'id = 3',v2:'(사용 안 함)',v3:'(사용 안 함)',on:[1,0,0],
  t:'단건 조회 — 경로만 쓴다',x:'"3번 글"이라는 <b>대상 지정</b>은 경로에 넣고 @PathVariable로 받는다.'},
 {url:'GET /api/posts?page=2&size=10',body:'',v1:'(사용 안 함)',v2:'page=2, size=10',v3:'(사용 안 함)',on:[0,1,0],
  t:'목록 조회 — 쿼리만 쓴다',x:'몇 페이지·몇 개씩 같은 <b>거르는 조건</b>은 쿼리에 넣고 @RequestParam으로 받는다.'},
 {url:'POST /api/posts',body:'{"title":"후기","content":"오늘 배운 것"}',v1:'(사용 안 함)',v2:'(사용 안 함)',v3:'PostCreateRequest 객체',on:[0,0,1],
  t:'글 생성 — 본문을 쓴다',x:'<b>만들 데이터</b>는 JSON 본문에 넣는다. MessageConverter가 통째로 DTO 객체로 바꿔 @RequestBody에 주입한다.'}
];
document.querySelectorAll('#t3 [data-r]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#t3 [data-r]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const d=T3[+b.dataset.r];
  $('t3url').textContent=d.url;$('t3body').textContent=d.body;
  $('t3v1').textContent=d.v1;$('t3v2').textContent=d.v2;$('t3v3').textContent=d.v3;
  [['t3b1','t3w1'],['t3b2','t3w2'],['t3b3','t3w3']].forEach((ids,i)=>{
    $(ids[0]).classList.toggle('dim',!d.on[i]);
    $(ids[1]).style.opacity=d.on[i]?1:.2;
    $(ids[0]).classList.toggle('hot',!!d.on[i]);
  });
  cap(d.t,d.x);
});
document.querySelector('#t3 [data-r="0"]').onclick();

/* ── 4 ── */
const T4=[
 {sit:'"1번 글 주세요" — 글을 찾아서 돌려줬다',r:['글 조회 완료','PostResponse 반환',''],code:'200',name:'OK',col:'#15803D',
  cl:['"성공이네, 받은 데이터로','화면을 그리자"','→ 글 화면 표시'],x:'조회 성공의 기본 코드. 본문에 데이터가 담긴다.'},
 {sit:'"글 등록해 주세요" — 새 글이 만들어졌다',r:['글 저장 완료','새 id = 13 발급',''],code:'201',name:'Created',col:'#15803D',
  cl:['"만들어졌구나!"','새 글 주소로 이동','→ 작성 완료 화면'],x:'"생성됐다"는 의도는 200이 아니라 201로 표현한다. 클라이언트가 결과를 정확히 판단하게 하는 것이 목적.'},
 {sit:'"글 등록해 주세요" — 그런데 제목이 비어 있다',r:['검증 실패','@NotBlank 위반','Controller 실행 안 됨'],code:'400',name:'Bad Request',col:'#C05656',
  cl:['"내(클라이언트) 요청이','잘못됐구나"','→ "제목은 필수" 안내'],x:'요청 자체의 잘못은 4xx. 그중 형식·값 오류가 400이다.'},
 {sit:'"999번 글 주세요" — 그런 글이 없다',r:['조회 실패','글 없음 → 예외 발생',''],code:'404',name:'Not Found',col:'#C05656',
  cl:['"그 글은 없구나"','','→ "글을 찾을 수 없어요"'],x:'없는 자원은 404. 200에 null을 주면 클라이언트가 성공인지 실패인지 알 수 없다.'},
 {sit:'일반 회원이 관리자 전용 삭제를 요청했다',r:['인가 실패','누군지는 알지만','권한이 없음'],code:'403',name:'Forbidden',col:'#C05656',
  cl:['"권한이 없구나"','','→ 접근 불가 안내'],x:'로그인 안 됨(누군지 모름)은 401, 권한 없음은 403. 인증과 인가의 차이가 코드로 갈린다.'}
];
document.querySelectorAll('#t4 [data-c]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#t4 [data-c]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const d=T4[+b.dataset.c];
  $('t4sit').textContent=d.sit;
  $('t4res1').textContent=d.r[0];$('t4res2').textContent=d.r[1];$('t4res3').textContent=d.r[2];
  $('t4code').textContent='?';$('t4ring').setAttribute('stroke','#8FA6C6');$('t4name').textContent='';
  $('t4cl1').textContent='';$('t4cl2').textContent='';$('t4cl3').textContent='';
  clearMarks('t4');
  seq([
    ()=>{mark('t4','t4a');$('t4pk').setAttribute('transform','translate(24,220)');cap('서버의 처리 결과',d.r.filter(Boolean).join(' · '));},
    ()=>{mark('t4','t4b');$('t4pk').setAttribute('transform','translate(280,222)');
         $('t4code').textContent=d.code;$('t4ring').setAttribute('stroke',d.col);
         $('t4code').setAttribute('fill',d.col);$('t4name').textContent=d.code+' '+d.name;
         cap('도장: '+d.code+' '+d.name,d.x);},
    ()=>{mark('t4','t4c');$('t4pk').setAttribute('transform','translate(490,220)');
         $('t4cl1').textContent=d.cl[0];$('t4cl2').textContent=d.cl[1];$('t4cl3').textContent=d.cl[2];
         cap('클라이언트의 해석',d.x);}
  ],1500);
});
document.querySelector('#t4 [data-c="0"]').onclick();

/* ── 5 ── */
function t5reset(){clearMarks('t5');$('t5pk').setAttribute('transform','translate(30,42)');
  $('t5okc').textContent='201 Created';$('t5okb').textContent='';$('t5erb').textContent='';}
const T5=[
 {req:'POST /api/posts (정상)',path:[
   ['t5-rq',[30,42],'요청 도착','제목·내용이 제대로 담긴 생성 요청이다.'],
   ['t5-vd',[30,150],'@Valid 검사 통과','@NotBlank·@Size 규칙을 모두 만족 — 아래로 통과.'],
   ['t5-ct',[30,264],'Controller 실행','Service가 글을 저장하고 결과를 반환한다.'],
   ['t5-ok',[30,460],'201 Created','성공 응답. <code>{"id":13,"title":"후기"}</code>']],
  fin:()=>{$('t5okb').textContent='{"id":13,"title":"후기"}';}},
 {req:'POST /api/posts (제목 없음)',path:[
   ['t5-rq',[30,42],'요청 도착','그런데 title이 빈 문자열이다.'],
   ['t5-vd',[30,150],'⛔ 검사대에서 차단','@NotBlank 위반. <b>Controller는 실행조차 되지 않는다</b> — 잘못된 입력은 입구에서 막힌다.'],
   ['t5-adv',[400,220],'예외 처리반이 받는다','검증 실패 예외를 전역 처리반이 가로채 400으로 변환한다.'],
   ['t5-er',[400,460],'400 Bad Request','<code>{"code":"INVALID_INPUT","message":"제목은 필수입니다"}</code>']],
  fin:()=>{$('t5erc').textContent='400 Bad Request';$('t5erb').textContent='{"code":"INVALID_INPUT","message":"제목은 필수입니다"}';}},
 {req:'GET /api/posts/999',path:[
   ['t5-rq',[30,42],'요청 도착','999번 글 조회. 형식은 정상이라 검사대도 통과한다.'],
   ['t5-ct',[30,264],'💥 작업실에서 예외 발생','DB에 글이 없다. Service는 HTTP를 모르니 예외만 던진다 — <code>throw PostNotFoundException</code>'],
   ['t5-adv',[400,220],'예외 처리반이 받는다','@ExceptionHandler가 가로채 404로 변환. Controller마다 try-catch를 쓰지 않는 이유.'],
   ['t5-er',[400,460],'404 Not Found','<code>{"code":"POST_NOT_FOUND","message":"글이 없습니다"}</code>']],
  fin:()=>{$('t5erc').textContent='404 Not Found';$('t5erb').textContent='{"code":"POST_NOT_FOUND","message":"글이 없습니다"}';}}
];
document.querySelectorAll('#t5 [data-v]').forEach(b=>b.onclick=()=>{
  t5reset();const d=T5[+b.dataset.v];
  $('t5req').textContent=d.req;
  seq(d.path.map(p=>()=>{
    mark('t5',p[0]);
    $('t5pk').setAttribute('transform',`translate(${p[1][0]},${p[1][1]})`);
    cap(p[2],p[3]);
    if(p===d.path[d.path.length-1])d.fin();
  }),1900);
});
t5reset();

/* 만화/도면 전환 */
const GIST={"t1": "DispatcherServlet이 요청 처리의 전체 흐름을 지휘한다.", "t2": "@Controller는 주로 화면, @RestController는 주로 JSON API를 반환한다.", "t3": "요청 위치에 맞는 애너테이션을 쓰고, API 입출력은 DTO로 분리한다.", "t4": "ResponseEntity로 응답의 본문과 상태 코드를 명확히 표현한다.", "t5": "입력은 @Valid로 검증하고, 예외는 @RestControllerAdvice에서 공통 처리한다."}, TITLE={"t1": "1. DispatcherServlet 요청 흐름", "t2": "2. @Controller vs @RestController", "t3": "3. 요청 데이터 받기와 DTO", "t4": "4. ResponseEntity와 상태 코드", "t5": "5. 검증과 예외 처리"};
document.querySelectorAll('.panel').forEach(p=>{
  p.querySelectorAll('.mv').forEach(b=>b.onclick=()=>{
    clearT();
    p.querySelectorAll('.mv').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    p.querySelector('.view.comic').classList.toggle('on',b.dataset.v==='comic');
    p.querySelector('.view.sim').classList.toggle('on',b.dataset.v==='sim');
    if(b.dataset.v==='comic')cap(TITLE[p.id]+' — 한 줄 핵심',GIST[p.id]);
    else cap(TITLE[p.id],'버튼으로 패킷을 움직여 흐름을 따라가 보자.');
  });
});
/* 탭 전환 시 만화 모드 캡션 반영 */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const p=document.getElementById(t.dataset.p);
  const comicOn=p.querySelector('.view.comic').classList.contains('on');
  if(comicOn)cap(TITLE[p.id]+' — 한 줄 핵심',GIST[p.id]);
}));

cap('1. DispatcherServlet 요청 흐름 — 한 줄 핵심', GIST['t1']);
</script>
</body>
</html>
